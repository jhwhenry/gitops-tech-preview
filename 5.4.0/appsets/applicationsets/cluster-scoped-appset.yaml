apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cpd-instance-cluster-scoped
  namespace: openshift-gitops
spec:
  # ENABLE GO TEMPLATES
  goTemplate: true

  # Use Matrix generator to combine global values with service configs
  generators:
    - matrix:
        generators:
          # First generator: Load global values from Git
          - git:
              repoURL: https://github.com/jhwhenry/gitops-tech-preview
              revision: 5.4.0_Patch8
              files:
                - path: 5.4.0/appsets/values-config/global-values-config.yaml
          
          # Second generator: Load individual service configurations (clusterScoped section)
          - git:
              repoURL: https://github.com/jhwhenry/gitops-tech-preview
              revision: 5.4.0_Patch8
              files:
                - path: 5.4.0/appsets/values-config/apps-config/*-config.yaml
                # platform-config has no cluster-scoped chart (no .clusterScoped section), which would render the Application name as "<no value>"
                - path: 5.4.0/appsets/values-config/apps-config/platform-config-config.yaml
                  exclude: true
  
  # Global template for all cluster-scoped applications
  template:
    metadata:
      name: '{{ .clusterScoped.appName }}'
      labels:
        app: '{{ .clusterScoped.appName }}'
        component-id: '{{ .componentID }}'
        managed-by: argocd-applicationset
        resource-scope: cluster-scoped
    
    spec:
      project: ibm-software-hub
      
      source:
        # IBM Helm chart repository — use per-app repoURL if set, otherwise fall back to global chart_repo
        repoURL: '{{ if .clusterScoped.repoURL }}{{ .clusterScoped.repoURL }}{{ else }}https://raw.github.com/jhwhenry/gitops-charts/main/softwarehub{{ end }}'
        targetRevision: '{{ .clusterScoped.version }}'
        chart: '{{ .clusterScoped.chart }}'
        
        helm:
          releaseName: '{{ .clusterScoped.appName }}'
          
          values: |
            # Global values loaded from global-values-config.yaml
            {{- if .global }}
            global:
              operatorNamespace: {{ .global.operatorNamespace }}
            {{- end }}
      
      destination:
        server: https://kubernetes.default.svc
        # Cluster-scoped resources do not belong to a namespace
        namespace: ''
      
      syncPolicy:
        # Auto sync disabled: syncs must be triggered manually
        syncOptions:
          # Replace strategy required for CRDs
          - Replace=true
          - RespectIgnoreDifferences=true
          - PrunePropagationPolicy=foreground
          - PruneLast=true
          - ServerSideApply=true
        
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
      
      # Ignore fields mutated by cluster controllers
      ignoreDifferences:
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          jsonPointers:
            - /status
            - /metadata/annotations
        - group: rbac.authorization.k8s.io
          kind: ClusterRole
          jsonPointers:
            - /rules