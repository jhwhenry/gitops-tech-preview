apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cpd-instance-namespace-scoped
  namespace: openshift-gitops
spec:
  # ENABLE GO TEMPLATES
  goTemplate: true

  # Use Matrix generator to combine global values with service-specific configs
  generators:
    - matrix:
        generators:
          # First generator: Load global values from Git
          - git:
              repoURL: https://github.com/jhwhenry/gitops-tech-preview
              revision: 5.4.0_Patch8
              files:
                - path: 5.4.0/appsets/values-config/global-values-config.yaml
          
          # Second generator: Load individual service configurations
          - git:
              repoURL: https://github.com/jhwhenry/gitops-tech-preview
              revision: 5.4.0_Patch8
              files:
                - path: 5.4.0/appsets/values-config/apps-config/*-config.yaml
  
  # Global template for all namespace-scoped applications
  template:
    metadata:
      name: '{{ .namespaceScoped.appName }}'
      labels:
        app: '{{ .namespaceScoped.appName }}'
        component-id: '{{ .componentID }}'
        managed-by: argocd-applicationset
        resource-scope: namespace-scoped
    
    spec:
      project: ibm-software-hub
      
      source:
        # IBM Helm chart repository — use per-app repoURL if set, otherwise fall back to global chart_repo
        repoURL: '{{ if .namespaceScoped.repoURL }}{{ .namespaceScoped.repoURL }}{{ else }}https://raw.github.com/jhwhenry/gitops-charts/main/softwarehub{{ end }}'
        targetRevision: '{{ .namespaceScoped.version }}'
        chart: '{{ .namespaceScoped.chart }}'
        
        helm:
          releaseName: '{{ .namespaceScoped.appName }}'
                    
          values: |
            # Global values loaded from global-values-config.yaml
            {{- if .global }}
            global:
            {{ .global | toYaml | nindent 2 }}
            {{- end }}

            # Chart-specific values from service config file
            {{- if .namespaceScoped.values }}
            {{ .namespaceScoped.values }}
            {{- end }}
      
      destination:
        server: https://kubernetes.default.svc
        namespace: default
      
      syncPolicy:
        # Auto sync disabled: syncs must be triggered manually
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m