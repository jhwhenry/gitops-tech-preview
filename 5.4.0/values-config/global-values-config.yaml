# Build global overrides for ApplicationSet (applicable to ALL components)

global:
  licenseAccept: true
  crAdoption: false
  releaseVersion: 5.4.0
  components:
    - ibm_pg_operator
    - zen
    - ws_pipelines
    - ibm_usage_metering
    - datastage_ent_plus
    - cpd_platform
    - platform-config
    - ccs
    - postgresql
    - opencontent_opensearch
    - cpfs

  # namespaces
  operatorNamespace: cpd-operators
  instanceNamespace: cpd-instance
  tetheredNamespaces: []

  # storage setting
  blockStorageClass: ocs-storagecluster-ceph-rbd
  fileStorageClass: ocs-storagecluster-cephfs

  # image setting
  imagePullPrefix: icr.io
  imagePullSecret: ibm-entitlement-key
  installConfigImagePullPrefix: icr.io
  installConfigImageName: cp/cpd/olm-utils-premium-v4
  installConfigImageDigest: sha256:e767e73bd6fac34cc8241f08af933c6f4f3239712121a04d313afadb8a8d506e

  # cluster setting
  clusterType: openshift
  connectionType: ingress
  # pre-computed release_components_meta for olm-utils-cm ConfigMap template
  cmReleaseCompsMeta: 
